<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闽南小吃</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .food-card:hover { transform: translateY(-5px); }
        #cart-bar { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #cart-detail { transition: transform 0.3s ease-out; transform: translateY(100%); }
        #cart-detail.active { transform: translateY(0); }
        .category-tab { transition: all 0.2s ease; }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 pb-32">

<header class="sticky top-0 bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-5xl font-black tracking-tighter text-black">闽南小吃.</h1>
        <div class="bg-black text-white px-4 py-1 rounded-full text-xs font-bold">营业中</div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-8">

    <div class="bg-white rounded-[2.5rem] p-8 border border-gray-100 shadow-sm mb-12">
        <h3 class="text-xl font-bold mb-4 flex items-center">📝 温馨提示</h3>
        <ul class="space-y-3 text-gray-600 text-sm">
            <li>• 以下均为商品大概价格，最终价格会在 WhatsApp 结算</li>
            <li>• 满 300 免配送费</li>
            <li>• 支付方式：Touch'n Go 或者 支付宝 / 微信（按当天汇率计算）</li>
        </ul>
    </div>

    <h2 class="text-4xl font-bold mb-8 italic">菜单</h2>

    <div class="flex gap-4 mb-8">
        <button onclick="filterMenu('小吃')" id="tab-小吃" class="category-tab px-8 py-2 rounded-full font-bold bg-black text-white">小吃</button>
        <button onclick="filterMenu('干货')" id="tab-干货" class="category-tab px-8 py-2 rounded-full font-bold bg-gray-200 text-gray-600">干货</button>
    </div>

    <div id="food-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
        <p class="text-gray-400">正在准备新鲜食材...</p>
    </div>

</main>

<div id="cart-bar" onclick="toggleCartDetail()"
     class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-black text-white rounded-3xl p-4 shadow-2xl z-[110] flex justify-between items-center hidden cursor-pointer">
    <div class="flex items-center gap-3">
        <div class="bg-orange-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px]" id="cart-count-badge">0</div>
        <p id="cart-summary" class="text-lg font-bold">RM 0</p>
    </div>
    <button onclick="event.stopPropagation(); sendOrder()"
            class="bg-white text-black px-6 py-2 rounded-2xl font-black active:scale-95 transition-transform">
        去结算
    </button>
</div>

<div id="cart-overlay" onclick="toggleCartDetail()" class="fixed inset-0 bg-black/40 hidden z-[105]"></div>

<div id="cart-detail"
     class="fixed bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] z-[108] p-8 pb-32 max-h-[70vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-black">已选商品</h3>
        <button onclick="clearCart()" class="text-gray-400 text-sm font-bold">清空购物车</button>
    </div>
    <div id="cart-list" class="space-y-6"></div>
</div>

<script>
    const RAW_URL = "https://ysdhfvypbbokdwvoorco.supabase.co";
    const RAW_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzZGhmdnlwYmJva2R3dm9vcmNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYyMTY3MjAsImV4cCI6MjA4MTc5MjcyMH0.Q5O2wdgrUL_d1JlD0TAMlTjIolwUctg4deXEFQ7pJ20";
    const MY_PHONE = "601116867588";

    const supabaseClient = supabase.createClient(RAW_URL, RAW_KEY);
    let cart = {};
    let allFoodData = []; 

    function updateUI() {
        let totalCount = 0;
        let totalPrice = 0;

        for (let name in cart) {
            totalCount += cart[name].count;
            totalPrice += cart[name].price * cart[name].count;
        }

        const bar = document.getElementById('cart-bar');
        if (totalCount > 0) {
            bar.classList.remove('hidden');
            document.getElementById('cart-summary').innerText = `RM ${totalPrice.toFixed(2)}`;
            document.getElementById('cart-count-badge').innerText = totalCount;
        } else {
            bar.classList.add('hidden');
            document.getElementById('cart-detail').classList.remove('active');
            document.getElementById('cart-overlay').classList.add('hidden');
        }

        updateCartListUI();
        updateFoodControls();
    }

    function updateCartListUI() {
        const list = document.getElementById('cart-list');
        list.innerHTML = Object.keys(cart).length
            ? Object.keys(cart).map(name => `
                <div class="flex justify-between items-center border-b pb-4">
                    <div>
                        <h4 class="font-bold">${name}</h4>
                        <p class="text-orange-600 font-black">RM ${(cart[name].price * cart[name].count).toFixed(2)}</p>
                    </div>
                    <div class="flex items-center bg-black text-white rounded-full px-4 py-2 w-32 justify-between shadow-lg">
                        <button class="font-bold text-xl px-2" onclick="changeQty('${name}', -1, ${cart[name].price})">-</button>
                        <span class="font-bold">${cart[name].count}</span>
                        <button class="font-bold text-xl px-2" onclick="changeQty('${name}', 1, ${cart[name].price})">+</button>
                    </div>
                </div>
            `).join('')
            : '<p class="text-gray-400 text-center py-10 font-bold">快去挑选美味吧~</p>';
    }

    function changeQty(name, delta, price) {
        if (!cart[name]) cart[name] = { price, count: 0 };
        cart[name].count += delta;
        if (cart[name].count <= 0) delete cart[name];
        updateUI();
    }

    function updateFoodControls() {
        document.querySelectorAll('[data-food]').forEach(el => {
            const name = el.dataset.food;
            const price = el.dataset.price;

            if (cart[name]) {
                el.innerHTML = `
                    <div class="flex items-center justify-between bg-black text-white rounded-full px-4 py-3 shadow-lg animate-in fade-in zoom-in duration-200">
                        <button class="font-bold text-xl px-2" onclick="changeQty('${name}', -1, ${price})">-</button>
                        <span class="font-bold">${cart[name].count} 份</span>
                        <button class="font-bold text-xl px-2" onclick="changeQty('${name}', 1, ${price})">+</button>
                    </div>
                `;
            } else {
                el.innerHTML = `
                    <button onclick="changeQty('${name}', 1, ${price})"
                        class="w-full bg-gray-100 py-4 rounded-full font-bold hover:bg-black hover:text-white transition-all active:scale-95">
                        加入购物车
                    </button>
                `;
            }
        });
    }

    // 核心筛选与渲染逻辑
    function filterMenu(category) {
        // 切换按钮样式
        document.querySelectorAll('.category-tab').forEach(btn => {
            btn.classList.remove('bg-black', 'text-white');
            btn.classList.add('bg-gray-200', 'text-gray-600');
        });
        document.getElementById(`tab-${category}`).classList.remove('bg-gray-200', 'text-gray-600');
        document.getElementById(`tab-${category}`).classList.add('bg-black', 'text-white');

        // 筛选数据（兼容处理：如果某项没有设置 category，默认归类为小吃）
        const filteredData = allFoodData.filter(item => {
            if (category === '小吃') {
                return !item.category || item.category === '小吃';
            }
            return item.category === category;
        });
        
        const container = document.getElementById('food-container');
        if (filteredData.length === 0) {
            container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-10 font-bold">暂无${category}商品...</p>`;
            return;
        }

        container.innerHTML = filteredData.map(item => `
            <div class="food-card bg-white rounded-[2.5rem] p-2 shadow border transition-transform">
                <div class="aspect-square rounded-[2rem] overflow-hidden bg-gray-50">
                    <img src="${item.image_url}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=美味筹备中'">
                </div>
                <div class="p-6">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg">${item.name}</h3>
                        <span class="text-orange-600 font-black text-lg">RM ${item.price}</span>
                    </div>
                    <p class="text-xs text-gray-400 mb-4 h-8 overflow-hidden line-clamp-2">${item.description || ''}</p>
                    <div data-food="${item.name}" data-price="${item.price}"></div>
                </div>
            </div>
        `).join('');

        updateFoodControls();
    }

    async function fetchMenu() {
        try {
            // 获取数据并按 sort_order 升序排列
            const { data, error } = await supabaseClient
                .from('foods')
                .select('*')
                .order('sort_order', { ascending: true });

            if (error) throw error;
            allFoodData = data; 
            filterMenu('小吃'); 
        } catch (err) {
            console.error("加载失败:", err);
        }
    }

    function toggleCartDetail() {
        document.getElementById('cart-detail').classList.toggle('active');
        document.getElementById('cart-overlay').classList.toggle('hidden');
    }

    function clearCart() {
        cart = {};
        updateUI();
    }

    function sendOrder() {
        let text = "你好！我想订购：\n\n";
        let total = 0;
        for (let name in cart) {
            text += `✅ ${name} x${cart[name].count} (RM ${(cart[name].price * cart[name].count).toFixed(2)})\n`;
            total += cart[name].price * cart[name].count;
        }
        text += `\n💰 合计 RM ${total.toFixed(2)}`;
        window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(text)}`);
    }

    fetchMenu();
</script>

</body>
</html>
